    {
      "name": "products",
      "label": "在线商店",
      "label_singular": "商品",
      "folder": "content/products",
      "create": true,
      "delete": false,
      "format": "json",
      "extension": "json",
      "identifier_field": "title",
      "slug": "{{id}}",
      "summary": "{{title}}",
      "sortable_fields": [
        "order",
        "title"
      ],
      "view_filters": [
        {
          "label": "网站展示中",
          "field": "published",
          "pattern": true
        },
        {
          "label": "已下架 / 待上架",
          "field": "published",
          "pattern": false
        }
      ],
      "fields": [
        {
          "name": "id",
          "label": "商品编号",
          "widget": "entry-id",
          "hint": "系统自动生成并保留，无需填写。修改商品名称不会改变已有网址。"
        },
        {
          "name": "title",
          "label": "商品名称",
          "widget": "string",
          "pattern": [
            "^.{1,200}$",
            "请填写不超过200字的商品名称"
          ],
          "hint": "正常填写商品名称和介绍即可。网站会根据资料自动生成供搜索引擎和 AI 搜索使用的信息，并随商品更新，无需额外设置。"
        },
        {
          "name": "title_en",
          "label": "英文商品名称",
          "widget": "string",
          "required": false
        },
        {
          "name": "category",
          "label": "商品类别",
          "widget": "select",
          "options": [
            {
              "label": "挂件",
              "value": "pendants"
            },
            {
              "label": "书法与符箓",
              "value": "calligraphy"
            }
          ],
          "default": "pendants"
        },
        {
          "name": "summary",
          "label": "中文短介绍",
          "widget": "text",
          "hint": "一句话说明商品是什么及其特色，会出现在商品列表。"
        },
        {
          "name": "summary_en",
          "label": "英文短介绍",
          "widget": "text",
          "required": false
        },
        {
          "name": "body",
          "label": "中文商品介绍",
          "widget": "text",
          "hint": "先填写已知的商品事实，再使用 AI 草拟描述。请勿填写未经确认的材质、尺寸或效果承诺。空一行即可分段。"
        },
        {
          "name": "body_en",
          "label": "英文商品介绍",
          "widget": "text",
          "required": false
        },
        {
          "name": "details",
          "label": "中文商品细节",
          "widget": "text",
          "required": false,
          "hint": "每行一项，例如「图案：文昌帝君」。只填写已确认的规格；无需凑齐未知的材质或尺寸。"
        },
        {
          "name": "details_en",
          "label": "英文商品细节",
          "widget": "text",
          "required": false
        },
        {
          "name": "faq",
          "label": "中文常见问题",
          "widget": "text",
          "required": false,
          "hint": "选填商品文化、图案或用途方面的问答。问题占一行，答案另起一行；两组之间空一行。价格、库存和款式信息由系统自动整理，配送退换规则统一使用商店设置。"
        },
        {
          "name": "faq_en",
          "label": "英文常见问题",
          "widget": "text",
          "required": false
        },
        {
          "name": "media",
          "label": "商品图片",
          "widget": "list",
          "required": false,
          "default": [],
          "summary": "{{fields.alt}}",
          "hint": "第一张是商品主图。使用真实商品照片；AI 场景图请打开「AI 辅助图片」并先核对商品细节。",
          "fields": [
            {
              "name": "kind",
              "label": "素材类型",
              "widget": "hidden",
              "default": "image"
            },
            {
              "name": "src",
              "label": "选择或上传图片",
              "widget": "image",
              "choose_url": false,
              "media_library": {
                "config": {
                  "max_file_size": 20000000
                }
              },
              "hint": "商品图片支持 JPG / PNG / WebP，单张不超过20MB。"
            },
            {
              "name": "alt",
              "label": "中文图片说明",
              "widget": "string",
              "required": false,
              "hint": "选填，可补充图案或拍摄角度；留空时会根据商品名称自动生成说明。"
            },
            {
              "name": "alt_en",
              "label": "英文图片说明",
              "widget": "string",
              "required": false,
              "hint": "选填，留空时自动生成说明。"
            },
            {
              "name": "generated",
              "label": "AI 辅助图片",
              "widget": "boolean",
              "default": false,
              "required": false,
              "hint": "用于在页面上说明这是一张 AI 辅助展示图。"
            }
          ]
        },
        {
          "name": "price",
          "label": "售价（美元）",
          "widget": "number",
          "required": false,
          "value_type": "float",
          "min": 0.01,
          "hint": "未设置款式时使用此价格。必须与 Stripe 单件价格一致；修改这里不会修改 Stripe 收款金额。不确定价格时留空。"
        },
        {
          "name": "currency",
          "label": "币种",
          "widget": "select",
          "options": [
            "USD"
          ],
          "default": "USD"
        },
        {
          "name": "stripe_url",
          "label": "Stripe 收款链接",
          "widget": "string",
          "required": false,
          "pattern": [
            "^https://buy\\.stripe\\.com/[A-Za-z0-9_]+$",
            "请填写 https://buy.stripe.com/ 开头的有效收款链接"
          ],
