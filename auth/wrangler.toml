name = "yangzhu-cms-auth"
main = "worker.mjs"
compatibility_date = "2026-09-01"
keep_vars = true
# Before deployment, set AUTH_ORIGIN to the exact Worker HTTPS origin.
[vars]
CMS_ORIGIN = "https://yangzhu.org"
AUTH_ORIGIN = "https://yangzhu-cms-auth.kewen-gu.workers.dev"
# ALLOWED_USERS is managed in the Cloudflare dashboard; preserve it on deployment.
# Configure GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET with wrangler secret put.
# Never put the secret in this file or the public admin folder.

[ai]
binding = "AI"
